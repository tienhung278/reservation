services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ..
      dockerfile: apps/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: 3001
      DATABASE_URL: postgres://reservation:reservation@postgres:5432/reservation
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo@example.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
      PG_POOL_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  seat-service:
    build:
      context: ..
      dockerfile: apps/seat-service/Dockerfile
    environment:
      SERVICE_NAME: seat-service
      PORT: 3002
      DATABASE_URL: postgres://reservation:reservation@postgres:5432/reservation
      RABBITMQ_URL: amqp://rabbitmq:5672
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      PG_POOL_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: ..
      dockerfile: apps/payment-service/Dockerfile
    environment:
      SERVICE_NAME: payment-service
      PORT: 3003
      DATABASE_URL: postgres://reservation:reservation@postgres:5432/reservation
      RABBITMQ_URL: amqp://rabbitmq:5672
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      MOCK_STRIPE_WEBHOOK_SECRET: ${MOCK_STRIPE_WEBHOOK_SECRET}
      PG_POOL_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      SERVICE_NAME: api-gateway
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      SEAT_SERVICE_URL: http://seat-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      seat-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:

